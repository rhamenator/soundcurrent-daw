name: Development checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: development-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-desktop:
    name: Linux desktop and synthetic tests
    needs: linux-tests
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every Linux shard to pass
        env:
          LINUX_RESULT: ${{ needs.linux-tests.result }}
        run: test "$LINUX_RESULT" = success
  linux-tests:
    name: Linux synthetic shard ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev libsndfile1-dev qt6-base-dev qt6-l10n-tools
      - name: Configure without a native audio daemon
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DSC_BUILD_DESKTOP=ON -DSC_BUILD_PIPEWIRE=OFF -DSC_BUILD_WARP_MAP_PROBE=ON -DSC_BUILD_PROTECTED_WARP_PROBE=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test synthetic workflows
        run: python3 .github/scripts/run-linux-test-shard.py build ${{ matrix.shard }} --count 3
      - name: Verify relocated native startup evidence (no audio replay)
        run: |
          python3 tests/native_startup_archive_integrity_tests.py
          python3 tests/native_startup_portability_tests.py
          python3 tests/native_buffer_archive_tests.py
          python3 tests/recording_feedback_archive_tests.py
          python3 tests/native_manual_panel_archive_tests.py
      - name: Verify installed fault evidence (no audio replay)
        run: |
          python3 tools/verify_installed_fault_evidence.py
          python3 tools/verify_installed_stretch_preview.py
          python3 tests/installed_stretch_evidence_tests.py
          python3 tools/verify_installed_render_recovery.py
          python3 tests/installed_render_recovery_evidence_tests.py
      - name: Verify retained Windows media (no native audio replay)
        run: |
          python3 tests/windows_capture_verifier_tests.py
          python3 tests/windows_playback_verifier_tests.py
          python3 tests/windows_desktop_verifier_tests.py
          python3 tests/windows_render_trace_analysis_tests.py
      - name: Verify Windows deployment input refusals (no installer execution)
        run: python3 tests/windows_package_input_tests.py
      - name: Verify retained short-span observations (no DSP replay)
        run: |
          python3 tools/verify_short_span_experiments.py
          python3 tests/results/M2/2026-10-10-unity-stretch-copy/verify.py
          python3 tests/results/M2/2026-10-10-explicit-stretch-context/verify.py
          python3 tests/results/M2/2026-10-10-stretch-region-quality/verify.py
          python3 tests/results/M8/2026-10-10-warp-map-planner/verify.py
          python3 tests/results/M8/2026-10-10-anchored-stretch/verify.py
          python3 tests/results/M8/2026-10-10-protected-warp/verify.py
      - name: Verify retained current native Windows preview (no native replay)
        run: |
          python3 tests/results/M2/2026-10-10-native-restart-qualified/capture_safety_tests.py
          python3 tests/results/M2/2026-10-10-native-restart-qualified/verify.py
          python3 tests/results/M2/2026-10-10-windows-installed-normal-restart/verify.py
          python3 tests/results/M2/2026-10-10-windows-recovery-guards/verify.py
          python3 tests/results/M2/2026-10-10-linux-parent-interruption/verify.py
          python3 tests/results/M2/2026-10-10-windows-parent-interruption/verify.py
          git fetch --no-tags --depth=1 origin 5300010ab521917027501c831b550092e535c210
          git fetch --no-tags --depth=1 origin b525b81c3cbe69cd8325fcaa6843df64913a14c7
          python3 tests/results/M2/2026-10-10-installed-linux-interruption/verify_tests.py
          git fetch --no-tags --depth=1 origin 4fb8c1cdf1b1365e5834256f4b39b51566dbed52
          git fetch --no-tags --depth=1 origin db20b368035992f91b30fa3d9b2f8ac530239e16
          python3 tests/results/M2/2026-10-10-installed-windows-interruption/verify_tests.py
      - name: Verify retained installed Windows preview (no native replay)
        run: |
          git fetch --no-tags --depth=1 origin b8cdb3e00da524e5be51b007c1f81d6e51806d72
          python3 tools/verify_windows_installed_preview.py
          python3 tests/windows_installed_claim_tests.py
      - name: Verify retained native Windows device-format controls (no audio replay)
        run: |
          git fetch --no-tags --depth=1 origin 54ca5d30703e5f6269327901cf148c78d34c1f94
          git fetch --no-tags --depth=1 origin d03ff77c8a47084ca9159aa2fa19b8fc5f06efcf
          python3 tools/verify_device_format_controls.py
      - name: Verify retained direct Windows startup observations (no audio replay)
        run: |
          git fetch --no-tags --depth=1 origin 7b497fa19d0c0d7b689cd7b2a1f4c278bd0359ca
          git fetch --no-tags --depth=1 origin 3fe56d1fea75e98448a813c2c2d1d4cdd7aaa07c
          python3 tools/verify_windows_direct_startup.py
      - name: Verify retained Windows startup scheduling (no audio replay)
        run: |
          git fetch --no-tags --depth=1 origin 54354221720f247c0180fa1495b54bb6946943be
          git fetch --no-tags --depth=1 origin f4fd822774acab970dec958465a23557e12af89e
          git fetch --no-tags --depth=1 origin 9422b625b679e6f9de7bf55099c28f352a341122
          git fetch --no-tags --depth=1 origin 1a48374e20aa8ce34942a1ce34fdb69fa2963c59
          python3 tools/verify_windows_startup_scheduling.py
      - name: Verify retained direct Windows Stop boundaries (no audio replay)
        run: |
          git fetch --no-tags --depth=1 origin df9611d3a0b57ba0848a7839def3770e41f54064
          python3 tools/verify_windows_stop_boundary.py
      - name: Verify retained Windows end guard (no native audio replay)
        run: |
          git fetch --no-tags --depth=1 origin 87a74cb196b4ccd746e5d237e73e13d574598129
          python3 tools/verify_windows_end_guard.py
      - name: Verify refreshed Windows installation and retained capture failures (no native replay)
        run: |
          git fetch --no-tags --depth=1 origin e91585d523d651f75ad4a3fae71ef3d2dae8c8fb
          python3 tools/verify_windows_installer_refresh.py
          python3 tests/windows_refresh_claim_tests.py
      - name: Verify retained Windows capture lease traces (no native replay)
        run: |
          git fetch --no-tags --depth=1 origin 097bbf9d759bcbf76a86902ccdb6ab613447ecd3
          python3 tools/verify_windows_capture_trace.py
          python3 tests/windows_capture_trace_claim_tests.py
      - name: Verify retained installed Windows stretch workflow (no native replay)
        run: |
          python3 tests/results/M2/2026-10-10-windows-installed-stretch-workflow/verify.py
          python3 tests/results/M2/2026-10-10-windows-installed-stretch-workflow/refusals.py
      - name: Verify retained installed protected preview observations (no native replay)
        run: |
          python3 tests/results/M2/2026-10-10-installed-protected-preview/verify.py
          python3 tests/results/M2/2026-10-10-installed-protected-preview/refusals.py
          python3 tests/results/M2/2026-10-10-windows-bounded-observation/verify.py
          python3 tests/results/M2/2026-10-10-windows-protected-preview/verify.py
          python3 tests/results/M2/2026-10-10-windows-protected-preview/refusals.py
      - name: Verify controller failure retention
        if: always()
        run: python3 tests/controller_retention_tests.py
      - name: Preserve controller failure projects
        if: always()
        run: python3 .github/scripts/retain-controller-failure-projects.py build
      - name: Retain test log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: true
          name: linux-synthetic-test-log-${{ matrix.shard }}
          path: |
            build/Testing/Temporary/*.log
            build/ci-test-inventory.json
            build/ci-shard-plan.json
            build/controller-failure-projects/**
            build/comp-assembly-state-evidence/**
            build/comp-assembly-job-evidence/**
            build/comp-regeneration-source-evidence/**
            build/comp-regeneration-history-evidence/**
            build/comp-paired-history-evidence/**
            build/comp-repeat-evidence/**
            build/comp-span-v2-evidence/**
            build/comp-pair-assembly-evidence/**
            build/comp-assembly-controller-evidence/**
            build/comp-assembly-ui-evidence/**
            build/comp-transition-ui-evidence/**
            build/comp-protected-ui-evidence/**
            build/comp-repeat-ui-evidence/**
            build/comp-protected-repeat-ui-evidence/**
            build/protected-core-sampling-evidence/**
            build/exact-processing-grid-evidence/**
            build/exact-warp-extents-evidence/**
            build/comp-clocked-protected-pair-evidence/**
            build/comp-clocked-protected-worker-evidence/**
            build/comp-clocked-protected-history-worker-evidence/**
            build/comp-clocked-protected-evidence/**
            build/comp-protected-clock-evidence/**
            build/comp-pair-controller-evidence/**
            build/comp-pair-state-evidence/**
            build/comp-pair-recovery-evidence/**
            build/comp-protected-pair-evidence/**
            build/comp-protected-assembly-evidence/**
            build/comp-protected-repeat-evidence/**
            build/comp-protected-span-evidence/**
            build/comp-protected-worker-evidence/**
            build/comp-span-worker-evidence/**
            build/comp-span-evidence/**
            build/comp-media-review-evidence/**
          if-no-files-found: ignore
  windows-core-cross-build:
    name: Windows core cross-build (no native runtime claim)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install cross compiler
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++-mingw-w64-x86-64
      - name: Configure state, engine and transport
        run: cmake -S . -B build-windows -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/windows-mingw.cmake -DSC_BUILD_MEDIA=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Compile
        run: cmake --build build-windows --parallel 2
  windows-native-packet-tests:
    name: Windows native packet ownership tests
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Prepare hash-pinned media dependency
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory native-dependencies | Out-Null
          Invoke-WebRequest -Uri "https://codeload.github.com/libsndfile/libsndfile/tar.gz/refs/tags/1.2.2" -OutFile native-dependencies/libsndfile-1.2.2.tar.gz
          if ((Get-FileHash native-dependencies/libsndfile-1.2.2.tar.gz).Hash.ToLowerInvariant() -ne "ffe12ef8add3eaca876f04087734e6e8e029350082f3251f565fa9da55b52121") { throw "libsndfile source differs from qualified dependency" }
          tar -xzf native-dependencies/libsndfile-1.2.2.tar.gz -C native-dependencies
          if ($LASTEXITCODE -ne 0) { throw "libsndfile extraction failed" }
      - name: Build and test MSVC inspection, recording and packet ownership without audio endpoints
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "SC_NATIVE_VS_PATH=%%i"
          if not defined SC_NATIVE_VS_PATH exit /b 1
          call "%SC_NATIVE_VS_PATH%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          cmake -S native-dependencies/libsndfile-1.2.2 -B native-dependencies/sndfile-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DBUILD_SHARED_LIBS=ON -DENABLE_EXTERNAL_LIBS=OFF -DENABLE_MPEG=OFF -DBUILD_PROGRAMS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_TESTING=OFF -DBUILD_REGTEST=OFF -DENABLE_EXPERIMENTAL=OFF -DINSTALL_PKGCONFIG_MODULE=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          if errorlevel 1 exit /b 1
          cmake --build native-dependencies/sndfile-build --parallel 2 --target sndfile
          if errorlevel 1 exit /b 1
          cmake -S . -B build-native -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DSC_BUILD_MEDIA=ON -DSC_BUILD_DESKTOP=OFF -DSC_BUILD_WARP_MAP_PROBE=ON -DSC_BUILD_PROTECTED_WARP_PROBE=ON "-DSNDFILE_LIBRARY=%CD%/native-dependencies/sndfile-build/sndfile.lib"
          if errorlevel 1 exit /b 1
          cmake --build build-native --parallel 2 --target sc-stretch-render-worker sc-comp-handle-render-tests sc-comp-window-state-tests sc-comp-handle-plan-tests sc-comp-transition-tests sc-crossfade-edit-tests sc-native-controller-wait-tests sc-native-cadence-tests sc-native-storage-budget-tests sc-recording-storage-budget-tests sc-prepared-spsc-queue-tests sc-pipewire-storage-budget-tests sc-pipewire-monitor-controller-tests sc-pipewire-state-tests sc-pipewire-owned-recording-tests sc-pipewire-stop-handoff-tests sc-pipewire-processing-handoff-tests sc-pipewire-journal-tests sc-pipewire-receipt-codec-tests sc-pipewire-receipt-tests sc-pipewire-monitor-render-tests sc-pipewire-monitor-capture-tests sc-native-monitor-startup-tests sc-monitor-startup-tests sc-native-original-recording-tests sc-wasapi-monitor-render-tests sc-wasapi-render-lifecycle-tests sc-wasapi-monitor-capture-tests sc-monitor-capture-stop-tests sc-monitor-control-tests sc-monitor-recording-tests sc-monitor-clock-handoff-tests sc-monitor-processing-tests sc-original-recording-tests sc-monitor-output-bank-tests sc-capture-fanout-tests sc-monitor-drift-tests sc-monitor-buffer-tests sc-monitor-kernel-tests sc-capture-bank-tests sc-clock-correlation-tests sc-loop-recording-tests sc-loop-playback-tests sc-take-lane-tests sc-manual-recording-tests sc-stretch-publication-tests sc-warp-map-probe sc-protected-plan-probe sc-protected-warp-probe sc-stretch-state-tests sc-stretch-render-worker sc-stretch-artifact-tests sc-positioned-resampling-tests sc-resampling-tests sc-clip-processing-tests sc-editing-tests sc-project-import-state-tests sc-session-tests sc-routing-tests sc-monitoring-tests sc-media-import-worker sc-media-transaction-tests sc-media-staging-tests sc-media-stage-worker sc-wave-validation-tests sc-approved-wave-probe sc-approved-media-tests sc-approved-media-probe sc-import-property-report-probe sc-reaper-import-tests sc-inspection-bundle-tests sc-import-report sc-import-inspect-worker sc-reaper-structure-tests sc-writer-timing-tests sc-wasapi-capture-fixture sc-wasapi-playback-fixture sc-wasapi-packet-copy-tests sc-wasapi-input-tests sc-wasapi-capture-trace-tests sc-wasapi-render-trace-tests sc-recording-tests sc-export-tests sc-resource-ledger-tests sc-wasapi-playback-owner-tests
          if errorlevel 1 exit /b 1
          set "PATH=%CD%\native-dependencies\sndfile-build;%PATH%"
          cmake --build build-native --parallel 2 --target sc-comp-clocked-protected-worker-fixture sc-comp-clocked-protected-span-tests sc-exact-warp-extents-tests sc-clocked-protected-warp-tests sc-exact-processing-grid-tests sc-protected-core-sampling-tests sc-comp-protected-worker-fixture sc-comp-protected-span-tests sc-comp-repeat-fixture sc-native-media-path-tests sc-comp-span-v2-fixture sc-comp-regeneration-history-tests sc-comp-regeneration-source-tests sc-comp-assembly-state-tests sc-comp-assembly-job-tests sc-comp-pair-assembly-tests sc-comp-pair-state-tests sc-comp-pair-recovery-fixture sc-comp-span-worker sc-comp-span-worker-fixture sc-comp-span-render-tests sc-comp-media-review-tests sc-comp-processing-recipe-tests sc-processing-grid-tests sc-comp-handle-pcm-tests sc-comp-handle-blend-tests sc-comp-processing-plan-tests
          if errorlevel 1 exit /b 1
          ctest --test-dir build-native -R "^(comp-clocked-protected-paired-production|comp-clocked-protected-mixed-production|comp-clocked-protected-worker|comp-clocked-protected-history-worker|comp-clocked-protected-44100|comp-clocked-protected-48000|comp-clocked-protected-96000|comp-protected-clock-oracle|exact-warp-extents|exact-warp-extents-oracle|clocked-protected-warp|wide-processing-grid|wide-processing-grid-oracle|protected-core-sampling|protected-core-sampling-oracle|comp-protected-repeated-production|comp-protected-assembly-publication|comp-protected-pair-recovery|comp-owned-protected-worker|comp-protected-span-render|comp-repeated-pair-production|native-media-long-path|comp-clocked-span-worker|comp-regeneration-history|comp-paired-history-review|comp-regeneration-source|comp-assembly-project-state|comp-owned-assembly-publication|comp-verified-pair-assembly|comp-paired-project-state|comp-paired-selection-recovery|comp-owned-span-worker|comp-uniform-span-render|comp-actual-media-review|comp-processing-recipe-recovery|comp-transition-processing-permissions|comp-handle-explicit-blend|comp-handle-pcm-assembly|exact-processing-grid|processing-grid-fraction-oracle)$" --output-on-failure --no-tests=error
          set "SC_COMP_TEST_EXIT=%ERRORLEVEL%"
          copy /Y "build-native\Testing\Temporary\LastTest.log" "build-native\Testing\Temporary\LastCompTest.log"
          if errorlevel 1 exit /b 1
          if not "%SC_COMP_TEST_EXIT%"=="0" exit /b %SC_COMP_TEST_EXIT%
          set "PATH=%CD%\native-dependencies\sndfile-build;%PATH%"
          set "SC_STRETCH_WORKER_QUALIFICATION=%CD%\build-native\stretch-worker-qualification.json"
          set "SC_PROTECTED_WARP_QUALIFICATION=%CD%\build-native\protected-warp-integration-qualification.json"
          set "SC_NATIVE_OWNER_FAILURE_EVIDENCE=%CD%\build-native\native-owner-failure-evidence"
          ctest --test-dir build-native -R "^(comp-handle-worker-workflows|comp-processed-window-state|comp-handle-envelope-plans|comp-transition-handles|paired-crossfade-edits|native-controller-wait-evidence|native-service-cadence|native-recording-storage-budget|recording-storage-capacity|prepared-spsc-capacity|pipewire-recording-storage-budget|pipewire-monitor-controller|pipewire-durable-route-outcomes|pipewire-owned-recording|pipewire-stop-publication|pipewire-shared-processing-handoffs|pipewire-recording-durable-prefix|pipewire-native-receipt-codec|pipewire-native-receipt-handoffs|pipewire-monitor-planar-render|pipewire-monitor-planar-capture|native-monitor-startup|bounded-monitor-startup|original-native-outcomes|wasapi-monitor-render-binding|wasapi-monitor-capture-binding|monitor-capture-stop|monitor-stop-handoff|combined-monitor-recording|original-monitor-clock-handoffs|bounded-monitor-processing|original-raw-recording|monitor-output-bank|capture-raw-monitor-fanout|monitor-drift-control|causal-monitor-buffer|monitor-kernel-feasibility|stamped-capture-bank|clock-correlation|continuous-loop-recording|loop-stream-playback-recording|retained-take-comp|manual-recording-control|manual-declared-reserve|stretch-selection-publication|experimental-protected-warp-geometry|experimental-protected-warp-rendering|experimental-warp-map-geometry|editable-stretch-state|stretch-timing-oracle|stretch-region-geometry|stretch-source-integrity|stretch-worker-workflows|worker-observation-failures|protected-warp-worker-workflows|protected-warp-package-inputs|clip-playback-rate|playback-rate-timing-oracle|positioned-resampling-kernel|positioned-resampling-workflow|fractional-timing-oracle|prepared-resampling|prepared-timing-oracle|resampler-source-integrity|clip-processing|multitrack-edits|project-import-state|session-state|project-routing|project-monitoring|media-provenance-transaction|verified-media-staging|verified-media-stage-worker|approved-wave-content|approved-wave-probe|approved-media-root|approved-media-probe|inspection-bundle|import-inspection-worker|reaper-structure|reaper-native-corpus|reaper-import-properties|import-property-protocol|writer-phase-timing|wasapi-(render-end|packet-copy|packet-admission|capture-trace|render-trace|playback-owner-rollback)|recording-recovery|offline-export|resource-ledger)$" --output-on-failure --no-tests=error
          if errorlevel 1 exit /b 1
      - name: Bounded original concurrent-owner diagnostic
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ownerProbePath = Join-Path $PWD "build-native/sc-manual-recording-tests.exe"
          if (-not (Test-Path $ownerProbePath)) {
            Write-Output "Owner diagnostic unavailable: native test executable was not built."
            exit 0
          }
          $env:PATH = "$PWD/native-dependencies/sndfile-build;$env:PATH"
          for ($ownerAttempt = 1; $ownerAttempt -le 3; ++$ownerAttempt) {
            Write-Output "Original concurrent-owner diagnostic attempt=$ownerAttempt of=3; unchanged20takes/5sdeadline"
            $ownerStdoutPath = Join-Path $PWD "build-native/manual-owner-$ownerAttempt-stdout.log"
            $ownerStderrPath = Join-Path $PWD "build-native/manual-owner-$ownerAttempt-stderr.log"
            $ownerProcess = Start-Process -FilePath $ownerProbePath -ArgumentList "--concurrent-owner-diagnostics" -PassThru -NoNewWindow -RedirectStandardOutput $ownerStdoutPath -RedirectStandardError $ownerStderrPath
            $ownerExited = $ownerProcess.WaitForExit(60000)
            if (-not $ownerExited) {
              $ownerProcess.Kill($true)
              if (-not $ownerProcess.WaitForExit(5000)) { throw "Owned diagnostic did not terminate after its outer experiment deadline." }
            }
            Get-Content -LiteralPath $ownerStdoutPath
            Get-Content -LiteralPath $ownerStderrPath
            if (-not $ownerExited) { throw "Owned concurrent diagnostic exceeded outer60s budget; original5s acceptance deadline unchanged." }
            if ($ownerProcess.ExitCode -ne 0) { throw "Original concurrent owner diagnostic failed; retain original take/worker state." }
          }
      - name: Test generated failure retention
        if: always()
        shell: pwsh
        run: ./tests/owner_retention_tests.ps1
      - name: Preserve generated owner failure projects
        if: always()
        shell: pwsh
        run: ./.github/scripts/retain-owner-failure-projects.ps1 -BuildDirectory ./build-native
      - name: Verify and preserve controller failure projects
        if: always()
        shell: pwsh
        run: |
          python tests/controller_retention_tests.py
          if ($LASTEXITCODE -ne 0) { throw "Controller retention self-test failed" }
          python .github/scripts/retain-controller-failure-projects.py build-native
          if ($LASTEXITCODE -ne 0) { throw "Controller failure retention failed" }
      - name: Retain native unit log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: true
          name: windows-native-packet-unit-log
          path: |
            build-native/Testing/Temporary/*.log
            build-native/manual-owner-*-stdout.log
            build-native/manual-owner-*-stderr.log
            build-native/native-owner-failure-evidence/**
            build-native/manual-owner-failure-projects/**
            build-native/controller-failure-projects/**
            build-native/comp-assembly-state-evidence/**
            build-native/comp-assembly-job-evidence/**
            build-native/comp-regeneration-source-evidence/**
            build-native/comp-regeneration-history-evidence/**
            build-native/comp-paired-history-evidence/**
            build-native/comp-repeat-evidence/**
            build-native/comp-span-v2-evidence/**
            build-native/comp-pair-assembly-evidence/**
            build-native/comp-pair-state-evidence/**
            build-native/comp-pair-recovery-evidence/**
            build-native/comp-protected-pair-evidence/**
            build-native/comp-protected-assembly-evidence/**
            build-native/comp-protected-repeat-evidence/**
            build-native/protected-core-sampling-evidence/**
            build-native/exact-processing-grid-evidence/**
            build-native/exact-warp-extents-evidence/**
            build-native/comp-clocked-protected-pair-evidence/**
            build-native/comp-clocked-protected-worker-evidence/**
            build-native/comp-clocked-protected-history-worker-evidence/**
            build-native/comp-clocked-protected-evidence/**
            build-native/comp-protected-clock-evidence/**
            build-native/comp-protected-span-evidence/**
            build-native/comp-protected-worker-evidence/**
            build-native/comp-span-worker-evidence/**
            build-native/comp-span-evidence/**
            build-native/comp-media-review-evidence/**
            build-native/warp-map-geometry-evidence/**
            build-native/protected-warp-geometry-evidence/**
            build-native/protected-warp-render-evidence/**
            build-native/stretch-worker-qualification.json
            build-native/protected-warp-integration-qualification.json
          if-no-files-found: ignore
  windows-desktop-workflows:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: main
            name: Windows desktop workflows
            artifact: windows-desktop-import-test-log
            targets: sc-crossfade-ui-tests sc-native-panel-tests sc-ui-tests sc-playback-controller-tests soundcurrent-daw sc-manual-panel-tests sc-stretch-parent-probe sc-stretch-controller-tests sc-stretch-ui-tests sc-protected-warp-ui-tests sc-timeline-ui-tests sc-media-copy-controller-tests sc-import-ui-tests sc-import-controller-tests sc-wave-controller-tests sc-import-media-ui-tests sc-localization-tests sc-stretch-artifact-tests sc-protected-warp-probe
            tests: "^(desktop-take-audition|desktop-paired-crossfade|desktop-native-recording-panel|desktop-loop-recording|desktop-loop-controls|desktop-playback-controller|desktop-retained-takes|desktop-stretch-parent-interruption|desktop-stretch-controller|desktop-stretch-ui|desktop-protected-warp-ui|desktop-playback-rate|desktop-positioned-clips|desktop-clip-processing|desktop-media-copy-controller|desktop-import-controller|desktop-import-ui|desktop-media-controller|desktop-import-media-ui|desktop-localization|windows-package-inputs|protected-warp-package-inputs)$"
          - suite: comp
            name: Windows comp desktop workflows
            artifact: windows-comp-desktop-log
            targets: sc-comp-transition-ui-tests sc-comp-assembly-ui-tests sc-comp-assembly-controller-tests sc-comp-pair-controller-tests
            tests: "^(desktop-comp-protected-transition|desktop-comp-repeated-transition|desktop-comp-transition-create|desktop-comp-assembly-apply|desktop-comp-assembly-ownership|desktop-comp-pair-supervision)$"
          - suite: protected-repeat
            name: Windows repeated protected desktop workflows
            artifact: windows-protected-repeat-desktop-log
            targets: sc-comp-transition-ui-tests
            tests: "^desktop-comp-protected-repeated-transition$"
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      SC_DESKTOP_TARGETS: ${{ matrix.targets }}
      SC_DESKTOP_TESTS: ${{ matrix.tests }}
      QT_QPA_PLATFORM: offscreen
      SC_PREVIEW_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Prepare the reviewed QtBase test SDK
        shell: pwsh
        run: ./.github/scripts/prepare-windows-desktop.ps1
      - name: Prepare hash-pinned media dependency
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory native-dependencies | Out-Null
          Invoke-WebRequest -Uri "https://codeload.github.com/libsndfile/libsndfile/tar.gz/refs/tags/1.2.2" -OutFile native-dependencies/libsndfile-1.2.2.tar.gz
          if ((Get-FileHash native-dependencies/libsndfile-1.2.2.tar.gz).Hash.ToLowerInvariant() -ne "ffe12ef8add3eaca876f04087734e6e8e029350082f3251f565fa9da55b52121") { throw "libsndfile source differs from qualified dependency" }
          tar -xzf native-dependencies/libsndfile-1.2.2.tar.gz -C native-dependencies
          if ($LASTEXITCODE -ne 0) { throw "libsndfile extraction failed" }
      - name: Build and test native desktop workflows without audio endpoints
        env:
          SC_CROSSFADE_CAPTURE: ${{ github.workspace }}/build-desktop-native/Testing/crossfade-ui
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "SC_DESKTOP_VS_PATH=%%i"
          if not defined SC_DESKTOP_VS_PATH exit /b 1
          call "%SC_DESKTOP_VS_PATH%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          python tools/windows_preview_bundle.py --snapshot-inputs .cache/windows-preview-build-inputs.json --expected-source "%SC_PREVIEW_SOURCE%"
          if errorlevel 1 exit /b 1
          call .github\scripts\build-preview-media.cmd
          if errorlevel 1 exit /b 1
          cmake -S . -B build-desktop-native -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DSC_BUILD_MEDIA=ON -DSC_BUILD_DESKTOP=ON -DSC_BUILD_WARP_MAP_PROBE=ON -DSC_BUILD_PROTECTED_WARP_PROBE=ON "-DCMAKE_PREFIX_PATH=%CD%/native-ui-dependencies/qt" "-DSNDFILE_LIBRARY=%CD%/native-dependencies/sndfile-build/sndfile.lib"
          if errorlevel 1 exit /b 1
          cmake --build build-desktop-native --parallel 2 --target %SC_DESKTOP_TARGETS%
          if errorlevel 1 exit /b 1
          set "PATH=%CD%\native-ui-dependencies\qt\bin;%CD%\native-dependencies\sndfile-build;%PATH%"
          set "QT_PLUGIN_PATH=%CD%\native-ui-dependencies\qt\plugins"
          rem The Windows offscreen plugin uses FreeType, not the native font database.
          set "QT_QPA_FONTDIR=%WINDIR%\Fonts"
          set "SC_PARENT_TIMING_EVIDENCE=%CD%\build-desktop-native\parent-observation-timing"
          ctest --test-dir build-desktop-native -R "%SC_DESKTOP_TESTS%" --output-on-failure --no-tests=error -V
          if errorlevel 1 exit /b 1
      - name: Collect native preview deployment inputs (not an installer)
        if: matrix.suite == 'main' && (github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'codex/windows-'))
        shell: pwsh
        env:
          SC_PREVIEW_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./.github/scripts/collect-windows-preview.ps1 -ExpectedSourceCommit $env:SC_PREVIEW_SOURCE
      - name: Retain native preview deployment inputs and corresponding source
        if: always() && matrix.suite == 'main' && (github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'codex/windows-'))
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: true
          name: windows-preview-build-inputs
          path: .cache/windows-preview-export/**
          retention-days: 3
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Retain independent native media build comparison
        if: always() && matrix.suite == 'main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: true
          name: windows-media-build-review
          path: .cache/windows-media-build-review/**
          retention-days: 3
          if-no-files-found: ignore
      - name: Verify and preserve desktop controller failure projects
        if: always()
        shell: pwsh
        run: |
          python tests/controller_retention_tests.py
          if ($LASTEXITCODE -ne 0) { throw "Controller retention self-test failed" }
          python .github/scripts/retain-controller-failure-projects.py build-desktop-native
          if ($LASTEXITCODE -ne 0) { throw "Controller failure retention failed" }
      - name: Retain native desktop evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: true
          name: ${{ matrix.artifact }}
          path: |
            build-desktop-native/comp-assembly-controller-evidence/**
            build-desktop-native/comp-assembly-ui-evidence/**
            build-desktop-native/comp-transition-ui-evidence/**
            build-desktop-native/comp-protected-ui-evidence/**
            build-desktop-native/comp-repeat-ui-evidence/**
            build-desktop-native/comp-protected-repeat-ui-evidence/**
            build-desktop-native/comp-pair-controller-evidence/**
            build-desktop-native/Testing/Temporary/*.log
            build-desktop-native/Testing/crossfade-ui/*.png
            build-desktop-native/controller-failure-projects/**
            build-desktop-native/parent-observation-timing/*.json
            native-ui-dependencies/verified-runtime.json
          if-no-files-found: ignore
  windows-desktop-import-tests:
    name: Windows desktop import and localization tests
    if: always()
    needs: windows-desktop-workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every native desktop workflow
        env:
          SC_DESKTOP_RESULT: ${{ needs.windows-desktop-workflows.result }}
        run: test "$SC_DESKTOP_RESULT" = success
