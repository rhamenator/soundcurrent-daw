name: Development checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: development-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-desktop:
    name: Linux desktop and synthetic tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev libsndfile1-dev qt6-base-dev qt6-l10n-tools
      - name: Configure without a native audio daemon
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DSC_BUILD_DESKTOP=ON -DSC_BUILD_PIPEWIRE=OFF
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test synthetic workflows
        run: ctest --test-dir build --output-on-failure --parallel 1
      - name: Verify relocated native startup evidence (no audio replay)
        run: |
          python3 tests/native_startup_archive_integrity_tests.py
          python3 tests/native_startup_portability_tests.py
          python3 tests/native_buffer_archive_tests.py
          python3 tests/recording_feedback_archive_tests.py
          python3 tests/native_manual_panel_archive_tests.py
      - name: Verify installed fault evidence (no audio replay)
        run: python3 tools/verify_installed_fault_evidence.py
      - name: Verify retained Windows media (no native audio replay)
        run: |
          python3 tests/windows_capture_verifier_tests.py
          python3 tests/windows_playback_verifier_tests.py
          python3 tests/windows_desktop_verifier_tests.py
          python3 tests/windows_render_trace_analysis_tests.py
      - name: Verify Windows deployment input refusals (no installer execution)
        run: python3 tests/windows_package_input_tests.py
      - name: Verify retained installed Windows preview (no native replay)
        run: |
          git fetch --no-tags --depth=1 origin b8cdb3e00da524e5be51b007c1f81d6e51806d72
          python3 tools/verify_windows_installed_preview.py
          python3 tests/windows_installed_claim_tests.py
      - name: Verify retained native Windows device-format controls (no audio replay)
        run: |
          git fetch --no-tags --depth=1 origin 54ca5d30703e5f6269327901cf148c78d34c1f94
          git fetch --no-tags --depth=1 origin d03ff77c8a47084ca9159aa2fa19b8fc5f06efcf
          python3 tools/verify_device_format_controls.py
      - name: Verify retained direct Windows startup observations (no audio replay)
        run: |
          git fetch --no-tags --depth=1 origin 7b497fa19d0c0d7b689cd7b2a1f4c278bd0359ca
          git fetch --no-tags --depth=1 origin 3fe56d1fea75e98448a813c2c2d1d4cdd7aaa07c
          python3 tools/verify_windows_direct_startup.py
      - name: Verify retained Windows startup scheduling (no audio replay)
        run: |
          git fetch --no-tags --depth=1 origin 54354221720f247c0180fa1495b54bb6946943be
          git fetch --no-tags --depth=1 origin f4fd822774acab970dec958465a23557e12af89e
          git fetch --no-tags --depth=1 origin 9422b625b679e6f9de7bf55099c28f352a341122
          git fetch --no-tags --depth=1 origin 1a48374e20aa8ce34942a1ce34fdb69fa2963c59
          python3 tools/verify_windows_startup_scheduling.py
      - name: Verify retained direct Windows Stop boundaries (no audio replay)
        run: |
          git fetch --no-tags --depth=1 origin df9611d3a0b57ba0848a7839def3770e41f54064
          python3 tools/verify_windows_stop_boundary.py
      - name: Verify retained Windows end guard (no native audio replay)
        run: |
          git fetch --no-tags --depth=1 origin 87a74cb196b4ccd746e5d237e73e13d574598129
          python3 tools/verify_windows_end_guard.py
      - name: Verify refreshed Windows installation and retained capture failures (no native replay)
        run: |
          git fetch --no-tags --depth=1 origin e91585d523d651f75ad4a3fae71ef3d2dae8c8fb
          python3 tools/verify_windows_installer_refresh.py
          python3 tests/windows_refresh_claim_tests.py
      - name: Verify retained Windows capture lease traces (no native replay)
        run: |
          git fetch --no-tags --depth=1 origin 097bbf9d759bcbf76a86902ccdb6ab613447ecd3
          python3 tools/verify_windows_capture_trace.py
          python3 tests/windows_capture_trace_claim_tests.py
      - name: Retain test log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-synthetic-test-log
          path: build/Testing/Temporary/*.log
          if-no-files-found: ignore
  windows-core-cross-build:
    name: Windows core cross-build (no native runtime claim)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install cross compiler
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++-mingw-w64-x86-64
      - name: Configure state, engine and transport
        run: cmake -S . -B build-windows -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/windows-mingw.cmake -DSC_BUILD_MEDIA=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Compile
        run: cmake --build build-windows --parallel 2
  windows-native-packet-tests:
    name: Windows native packet ownership tests
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Prepare hash-pinned media dependency
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory native-dependencies | Out-Null
          Invoke-WebRequest -Uri "https://codeload.github.com/libsndfile/libsndfile/tar.gz/refs/tags/1.2.2" -OutFile native-dependencies/libsndfile-1.2.2.tar.gz
          if ((Get-FileHash native-dependencies/libsndfile-1.2.2.tar.gz).Hash.ToLowerInvariant() -ne "ffe12ef8add3eaca876f04087734e6e8e029350082f3251f565fa9da55b52121") { throw "libsndfile source differs from qualified dependency" }
          tar -xzf native-dependencies/libsndfile-1.2.2.tar.gz -C native-dependencies
          if ($LASTEXITCODE -ne 0) { throw "libsndfile extraction failed" }
      - name: Build and test MSVC inspection, recording and packet ownership without audio endpoints
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "SC_NATIVE_VS_PATH=%%i"
          if not defined SC_NATIVE_VS_PATH exit /b 1
          call "%SC_NATIVE_VS_PATH%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          cmake -S native-dependencies/libsndfile-1.2.2 -B native-dependencies/sndfile-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DBUILD_SHARED_LIBS=ON -DENABLE_EXTERNAL_LIBS=OFF -DENABLE_MPEG=OFF -DBUILD_PROGRAMS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_TESTING=OFF -DBUILD_REGTEST=OFF -DENABLE_EXPERIMENTAL=OFF -DINSTALL_PKGCONFIG_MODULE=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          if errorlevel 1 exit /b 1
          cmake --build native-dependencies/sndfile-build --parallel 2 --target sndfile
          if errorlevel 1 exit /b 1
          cmake -S . -B build-native -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DSC_BUILD_MEDIA=ON -DSC_BUILD_DESKTOP=OFF "-DSNDFILE_LIBRARY=%CD%/native-dependencies/sndfile-build/sndfile.lib"
          if errorlevel 1 exit /b 1
          cmake --build build-native --parallel 2 --target sc-stretch-render-worker sc-stretch-artifact-tests sc-positioned-resampling-tests sc-resampling-tests sc-clip-processing-tests sc-editing-tests sc-project-import-state-tests sc-session-tests sc-routing-tests sc-monitoring-tests sc-media-import-worker sc-media-transaction-tests sc-media-staging-tests sc-media-stage-worker sc-wave-validation-tests sc-approved-wave-probe sc-approved-media-tests sc-approved-media-probe sc-import-property-report-probe sc-reaper-import-tests sc-inspection-bundle-tests sc-import-report sc-import-inspect-worker sc-reaper-structure-tests sc-writer-timing-tests sc-wasapi-capture-fixture sc-wasapi-playback-fixture sc-wasapi-packet-copy-tests sc-wasapi-input-tests sc-wasapi-capture-trace-tests sc-wasapi-render-trace-tests sc-recording-tests sc-export-tests sc-resource-ledger-tests sc-wasapi-playback-owner-tests
          if errorlevel 1 exit /b 1
          set "PATH=%CD%\native-dependencies\sndfile-build;%PATH%"
          ctest --test-dir build-native -R "^(stretch-source-integrity|stretch-worker-workflows|clip-playback-rate|playback-rate-timing-oracle|positioned-resampling-kernel|positioned-resampling-workflow|fractional-timing-oracle|prepared-resampling|prepared-timing-oracle|resampler-source-integrity|clip-processing|multitrack-edits|project-import-state|session-state|project-routing|project-monitoring|media-provenance-transaction|verified-media-staging|verified-media-stage-worker|approved-wave-content|approved-wave-probe|approved-media-root|approved-media-probe|inspection-bundle|import-inspection-worker|reaper-structure|reaper-native-corpus|reaper-import-properties|import-property-protocol|writer-phase-timing|wasapi-(packet-copy|packet-admission|capture-trace|render-trace|playback-owner-rollback)|recording-recovery|offline-export|resource-ledger)$" --output-on-failure --no-tests=error
          if errorlevel 1 exit /b 1
      - name: Retain native unit log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-native-packet-unit-log
          path: build-native/Testing/Temporary/*.log
          if-no-files-found: ignore
  windows-desktop-import-tests:
    name: Windows desktop import and localization tests
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Prepare the reviewed QtBase test SDK
        shell: pwsh
        run: ./.github/scripts/prepare-windows-desktop.ps1
      - name: Prepare hash-pinned media dependency
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory native-dependencies | Out-Null
          Invoke-WebRequest -Uri "https://codeload.github.com/libsndfile/libsndfile/tar.gz/refs/tags/1.2.2" -OutFile native-dependencies/libsndfile-1.2.2.tar.gz
          if ((Get-FileHash native-dependencies/libsndfile-1.2.2.tar.gz).Hash.ToLowerInvariant() -ne "ffe12ef8add3eaca876f04087734e6e8e029350082f3251f565fa9da55b52121") { throw "libsndfile source differs from qualified dependency" }
          tar -xzf native-dependencies/libsndfile-1.2.2.tar.gz -C native-dependencies
          if ($LASTEXITCODE -ne 0) { throw "libsndfile extraction failed" }
      - name: Build and test native desktop workflows without audio endpoints
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "SC_DESKTOP_VS_PATH=%%i"
          if not defined SC_DESKTOP_VS_PATH exit /b 1
          call "%SC_DESKTOP_VS_PATH%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          cmake -S native-dependencies/libsndfile-1.2.2 -B native-dependencies/sndfile-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DBUILD_SHARED_LIBS=ON -DENABLE_EXTERNAL_LIBS=OFF -DENABLE_MPEG=OFF -DBUILD_PROGRAMS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_TESTING=OFF -DBUILD_REGTEST=OFF -DENABLE_EXPERIMENTAL=OFF -DINSTALL_PKGCONFIG_MODULE=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          if errorlevel 1 exit /b 1
          cmake --build native-dependencies/sndfile-build --parallel 2 --target sndfile
          if errorlevel 1 exit /b 1
          cmake -S . -B build-desktop-native -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DSC_BUILD_MEDIA=ON -DSC_BUILD_DESKTOP=ON "-DCMAKE_PREFIX_PATH=%CD%/native-ui-dependencies/qt" "-DSNDFILE_LIBRARY=%CD%/native-dependencies/sndfile-build/sndfile.lib"
          if errorlevel 1 exit /b 1
          cmake --build build-desktop-native --parallel 2 --target soundcurrent-daw sc-timeline-ui-tests sc-media-copy-controller-tests sc-import-ui-tests sc-import-controller-tests sc-wave-controller-tests sc-import-media-ui-tests sc-localization-tests
          if errorlevel 1 exit /b 1
          set "PATH=%CD%\native-ui-dependencies\qt\bin;%CD%\native-dependencies\sndfile-build;%PATH%"
          set "QT_PLUGIN_PATH=%CD%\native-ui-dependencies\qt\plugins"
          ctest --test-dir build-desktop-native -R "^(desktop-playback-rate|desktop-positioned-clips|desktop-clip-processing|desktop-media-copy-controller|desktop-import-controller|desktop-import-ui|desktop-media-controller|desktop-import-media-ui|desktop-localization|windows-package-inputs)$" --output-on-failure --no-tests=error -V
          if errorlevel 1 exit /b 1
      - name: Retain native desktop evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-desktop-import-test-log
          path: |
            build-desktop-native/Testing/Temporary/*.log
            native-ui-dependencies/verified-runtime.json
          if-no-files-found: ignore
